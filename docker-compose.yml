name: open-silong

services:
  postgres:
    image: postgres:17-alpine
    container_name: open-silong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: open-silong-convex
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME}
      INSTANCE_SECRET: ${INSTANCE_SECRET}

      POSTGRES_URL: ${POSTGRES_URL}
      DO_NOT_REQUIRE_SSL: ${DO_NOT_REQUIRE_SSL}

      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN}

      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      REDACT_LOGS_TO_CLIENT: "true"
    volumes:
      - convex_data:/convex/data
    ports:
      - "10.8.0.1:3210:3210"
      - "10.8.0.1:3211:3211"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:3210/version"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: open-silong-convex-dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_CLOUD_ORIGIN}
    ports:
      - "10.8.0.1:6791:6791"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN}
        CONVEX_SERVER_URL: http://backend:3210
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL}
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    container_name: open-silong-app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CONVEX_SERVER_URL: http://backend:3210
      NEXT_PUBLIC_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    ports:
      - "10.8.0.1:3100:3000"

volumes:
  postgres_data:
  convex_data:
