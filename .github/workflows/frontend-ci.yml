name: CI

# open-silong is a PUBLIC repository, so GitHub-hosted runners are free and
# unmetered. That is why this runs on every push and PR rather than being
# workflow_dispatch-only like the private repos in this account.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: rules · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time only. The client bundle needs a URL to inline; no secret
      # is involved and no deploy happens from CI.
      NEXT_PUBLIC_CONVEX_URL: https://canny-flamingo-7.convex.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # Fails fast and cheaply — a CLAUDE.md rule violation should not wait
      # behind a 40s typecheck to be reported.
      - name: Project rules
        run: bun run check:rules

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bunx vitest run --reporter=default

      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**', 'frontend/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: bunx next build
